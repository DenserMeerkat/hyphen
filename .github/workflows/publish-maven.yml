name: Maven Central

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Library version to publish (e.g. 0.5.0-alpha01). Leave empty to use default.'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set Library Version
        run: |
          # 1. Use the manually entered version if provided
          if [ ! -z "${{ github.event.inputs.version }}" ]; then
            echo "LIBRARY_VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
            echo "Publishing manually specified version: ${{ github.event.inputs.version }}"
          # 2. Extract version from tag name (e.g. v0.5.0-alpha01 -> 0.5.0-alpha01)
          elif [[ "${{ github.ref_name }}" =~ ^v[0-9] ]]; then
            CLEAN_VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
            echo "LIBRARY_VERSION=$CLEAN_VERSION" >> $GITHUB_ENV
            echo "Publishing version from tag: $CLEAN_VERSION"
          # 3. Fallback to gradle build default
          else
            echo "Publishing using default version from build configuration."
          fi

      - name: Publish to MavenCentral
        run: ./gradlew publishToMavenCentral --no-configuration-cache --no-daemon
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Extract Release Notes
        id: extract_changelog
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "Extracting release notes for version: $VERSION"
          python -c "
          import re
          version = '$VERSION'
          with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
              content = f.read()
          pattern = r'## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=\n## \[\d|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              notes = match.group(1).strip()
              if notes.endswith('---'):
                  notes = notes[:-3].strip()
              versions = re.findall(r'## \[([^\]]+)\]', content)
              prev_version = None
              if version in versions:
                  idx = versions.index(version)
                  if idx + 1 < len(versions):
                      prev_version = versions[idx + 1]
              if prev_version:
                  notes += f'\n\n**Full Changelog**: https://github.com/DenserMeerkat/hyphen/compare/v{prev_version}...v{version}'
              with open('release_notes.md', 'w', encoding='utf-8') as out:
                  out.write(notes)
              print('Successfully extracted release notes:')
              print(notes)
          else:
              print(f'Warning: No release notes found for version {version}')
              with open('release_notes.md', 'w', encoding='utf-8') as out:
                  out.write('Release notes not found.')
          "

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

